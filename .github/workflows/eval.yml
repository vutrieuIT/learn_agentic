name: LLM Eval

on:
  push:
    branches: [main]
    paths:
      - 'module4_llmops/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'module4_llmops/**'
      - 'shared/**'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python module4_llmops/eval_05.py