services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag_pgvector
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pwd
      POSTGRES_DB: rag
    ports:
      - '5432:5432'
    volumes:
      - rag_pgdata:/var/lib/postgresql/data

volumes:
  rag_pgdata:
